services:
  web:
    image: melktoday-frontend:dev
    container_name: melktoday-dev-frontend
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_DEV_BIND:-0.0.0.0}:${FRONTEND_DEV_PORT:-3003}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
