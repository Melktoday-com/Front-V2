services:
  web:
    image: melktoday-frontend:prod
    container_name: melktoday-prod-frontend
    env_file:
      - .env.production
    environment:
      - TILE_CACHE_DIR=/app/.cache/tiles
    volumes:
      - melktoday-tile-cache:/app/.cache/tiles
    ports:
      - "127.0.0.1:${FRONTEND_PROD_PORT:-3002}:3000"
    restart: unless-stopped

volumes:
  melktoday-tile-cache:
    name: melktoday-tile-cache

