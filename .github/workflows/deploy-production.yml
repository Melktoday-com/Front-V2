name: Deploy frontend production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: melktoday-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.MELKTODAY_DEPLOY_SSH_KEY }}" > ~/.ssh/melktoday_deploy
          chmod 600 ~/.ssh/melktoday_deploy
          ssh-keyscan -H "${{ secrets.MELKTODAY_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend on server
        env:
          DEPLOY_HOST: ${{ secrets.MELKTODAY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.MELKTODAY_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/melktoday_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'APP_DIR=/core/projects/Front_end/Front-V2 BRANCH=main bash scripts/deploy-production.sh'
